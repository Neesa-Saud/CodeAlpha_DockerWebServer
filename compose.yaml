services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codealpha-webserver
    ports:
      - "8080:80"
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx","-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
